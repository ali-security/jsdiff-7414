name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.11.0'

      - name: Install Chrome for Testing (pin for Karma Intl.Segmenter)
        run: |
          set -euxo pipefail
          CHROME_VERSION="120.0.6099.109"
          mkdir -p /tmp/cft-jsdiff
          curl -fsSL "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" -o /tmp/chrome-linux64.zip
          python3 -m zipfile -e /tmp/chrome-linux64.zip /tmp/cft-jsdiff
          echo "CHROME_BIN=/tmp/cft-jsdiff/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests (Mocha + Karma)
        run: yarn grunt test
